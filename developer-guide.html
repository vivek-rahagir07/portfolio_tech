            function getCategoryColor(node, parent = null) {

                        return colors;
                    }
                }

                    if (parentColors.name !== 'Default') {

                    }
                }

                        if (node.children.some(child => child.id === catId || child.id.startsWith(catId))) {
                            return colors;
                        }
                    }
                }
                
                return { primary: '#d4af37', secondary: '#fbbf24', name: 'Default' };

            function calculatePositions(node, x, y, level, parentExpanded, direction = 'down') {
                node.x = x;
                node.y = y;
                node.level = level;
                node.baseX = x;
                node.baseY = y;
                
                
                if (node.children && node.children.length > 0 && parentExpanded) {
                    if (node.level === 0) {
                        
                        const horizontalSpacing = 250;
                        const verticalSpacing = 200;
                        
                        
                        const child0 = node.children[0]; 
                        const child1 = node.children[1]; 
                        child0.direction = 'up';
                        child1.direction = 'up';
                        calculatePositions(child0, x - horizontalSpacing / 2, y - verticalSpacing, level + 1, true, 'up');
                        calculatePositions(child1, x + horizontalSpacing / 2, y - verticalSpacing, level + 1, true, 'up');
                        
                        
                        const child2 = node.children[2]; 
                        const child3 = node.children[3]; 
                        child2.direction = 'left';
                        child3.direction = 'right';
                        calculatePositions(child2, x - horizontalSpacing, y, level + 1, true, 'left');
                        calculatePositions(child3, x + horizontalSpacing, y, level + 1, true, 'right');
                        
                        
                        const child4 = node.children[4]; 
                        const child5 = node.children[5]; 
                        child4.direction = 'down';
                        child5.direction = 'down';
                        calculatePositions(child4, x - horizontalSpacing / 2, y + verticalSpacing, level + 1, true, 'down');
                        calculatePositions(child5, x + horizontalSpacing / 2, y + verticalSpacing, level + 1, true, 'down');
                    } else {
                        
                        const horizontalSpacing = 120;
                        const verticalSpacing = 120;
                        
                        if (direction === 'up') {
                            
                            const totalWidth = node.children.length * horizontalSpacing;
                            let currentX = x - totalWidth / 2;
                            
                            node.children.forEach((child, index) => {
                                const childX = currentX + horizontalSpacing / 2;
                                const childY = y - verticalSpacing;
                                const isExpanded = expandedNodes.has(child.id);
                                calculatePositions(child, childX, childY, level + 1, isExpanded, 'up');
                                currentX += horizontalSpacing;
                            });
                        } else if (direction === 'down') {
                            
                            const totalWidth = node.children.length * horizontalSpacing;
                            let currentX = x - totalWidth / 2;
                            
                            node.children.forEach((child, index) => {
                                const childX = currentX + horizontalSpacing / 2;
                                const childY = y + verticalSpacing;
                                const isExpanded = expandedNodes.has(child.id);
                                calculatePositions(child, childX, childY, level + 1, isExpanded, 'down');
                                currentX += horizontalSpacing;
                            });
                        } else if (direction === 'left') {
                            
                            const totalHeight = node.children.length * verticalSpacing;
                            let currentY = y - totalHeight / 2;
                            
                            node.children.forEach((child, index) => {
                                const childX = x - horizontalSpacing;
                                const childY = currentY + verticalSpacing / 2;
                                const isExpanded = expandedNodes.has(child.id);
                                calculatePositions(child, childX, childY, level + 1, isExpanded, 'left');
                                currentY += verticalSpacing;
                            });
                        } else if (direction === 'right') {
                            
                            const totalHeight = node.children.length * verticalSpacing;
                            let currentY = y - totalHeight / 2;
                            
                            node.children.forEach((child, index) => {
                                const childX = x + horizontalSpacing;
                                const childY = currentY + verticalSpacing / 2;
                                const isExpanded = expandedNodes.has(child.id);
                                calculatePositions(child, childX, childY, level + 1, isExpanded, 'right');
                                currentY += verticalSpacing;
                            });
                        }
                    }
                }
            }
            
            
            function updateAnimations() {
                const now = Date.now();
                const animationDuration = 400; 
                
                for (const [nodeId, anim] of animatingNodes) {
                    const elapsed = now - anim.startTime;
                    const progress = Math.min(elapsed / animationDuration, 1);
                    
                    
                    const eased = 1 - Math.pow(1 - progress, 3);
                    
                    anim.opacity = anim.startOpacity + (anim.targetOpacity - anim.startOpacity) * eased;
                    anim.scale = anim.startScale + (anim.targetScale - anim.startScale) * eased;
                    
                    if (progress >= 1) {
                        animatingNodes.delete(nodeId);
                    }
                }
            }
            
            
            function animateNode(node, targetOpacity, targetScale) {
                const currentAnim = animatingNodes.get(node.id);
                animatingNodes.set(node.id, {
                    startTime: Date.now(),
                    startOpacity: currentAnim ? currentAnim.opacity : targetOpacity === 1 ? 0 : 1,
                    targetOpacity: targetOpacity,
                    startScale: currentAnim ? currentAnim.scale : targetScale === 1 ? 0.5 : 1,
                    targetScale: targetScale
                });
                
                
                if (node.children) {
                    node.children.forEach(child => animateNode(child, targetOpacity, targetScale));
                }
            }
            
            
            function drawNode(node, parent = null) {
                const width = node.level === 0 ? 160 : node.level === 1 ? 140 : node.level === 2 ? 120 : 100;
                const height = node.level === 0 ? 60 : node.level === 1 ? 50 : node.level === 2 ? 45 : 40;
                const isHovered = hoveredNode === node;
                const pulse = Math.sin(time * 0.003 + node.level * 0.5) * 0.05 + 1;
                const floatY = Math.sin(time * 0.002 + node.level * 0.3) * 3;
                const hasChildren = node.children && node.children.length > 0;
                const isExpanded = expandedNodes.has(node.id);
                
                
                const anim = animatingNodes.get(node.id);
                const opacity = anim ? anim.opacity : 1;
                const animScale = anim ? anim.scale : 1;
                
                
                const colors = getCategoryColor(node, parent);
                const primaryColor = node.level === 0 ? '#d4af37' : colors.primary;
                const secondaryColor = node.level === 0 ? '#fbbf24' : colors.secondary;
                
                
                const drawX = (node.x + offsetX) * scale;
                const drawY = (node.y + offsetY + floatY) * scale;
                const drawWidth = width * (isHovered ? 1.15 : pulse) * animScale * scale;
                const drawHeight = height * (isHovered ? 1.15 : pulse) * animScale * scale;
                
                ctx.save();
                ctx.globalAlpha = opacity;
                
                
                ctx.beginPath();
                ctx.roundRect(drawX - drawWidth / 2, drawY - drawHeight / 2, drawWidth, drawHeight, 10);
                
                let gradient;
                if (node.level === 0) {
                    gradient = ctx.createLinearGradient(drawX - drawWidth / 2, drawY - drawHeight / 2, drawX + drawWidth / 2, drawY + drawHeight / 2);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
                    gradient.addColorStop(0.5, `rgba(212, 175, 55, 0.4)`);
                    gradient.addColorStop(1, 'rgba(212, 175, 55, 0.2)');
                } else {
                    gradient = ctx.createLinearGradient(drawX - drawWidth / 2, drawY - drawHeight / 2, drawX + drawWidth / 2, drawY + drawHeight / 2);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                    gradient.addColorStop(0.5, `${primaryColor}40`);
                    gradient.addColorStop(1, `${primaryColor}15`);
                }
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                
                ctx.strokeStyle = node.level === 0 ? '#d4af37' : primaryColor;
                ctx.lineWidth = (isHovered ? 3 : 2) * scale;
                ctx.stroke();
                
                
                if (node.level <= 1) {
                    ctx.beginPath();
                    ctx.roundRect(drawX - drawWidth / 2 + 5 * scale, drawY - drawHeight / 2 + 5 * scale, drawWidth - 10 * scale, drawHeight - 10 * scale, 6);
                    ctx.strokeStyle = `${primaryColor}66`;
                    ctx.lineWidth = 1 * scale;
                    ctx.stroke();
                }
                
                
                if (hasChildren) {
                    const indicatorSize = 8 * scale;
                    ctx.beginPath();
                    ctx.arc(drawX - drawWidth / 2 + 10 * scale, drawY - drawHeight / 2 + 10 * scale, indicatorSize, 0, Math.PI * 2);
                    ctx.fillStyle = node.level === 0 ? '#d4af37' : primaryColor;
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2 * scale;
                    ctx.stroke();
                    
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${12 * scale}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(isExpanded ? '-' : '+', drawX - drawWidth / 2 + 10 * scale, drawY - drawHeight / 2 + 10 * scale);
                }
                
                
                ctx.fillStyle = '#fff';
                ctx.font = `${node.level === 0 ? 'bold 14px' : node.level === 1 ? 'bold 13px' : '12px'} 'Segoe UI', Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                
                const words = node.label.split(' ');
                if (words.length > 1 && node.label.length > 12) {
                    ctx.fillText(words.slice(0, Math.ceil(words.length / 2)).join(' '), drawX, drawY - 6 * scale);
                    ctx.fillText(words.slice(Math.ceil(words.length / 2)).join(' '), drawX, drawY + 8 * scale);
                } else {
                    ctx.fillText(node.label, drawX, drawY);
                }
                
                
                if (node.difficulty && node.level > 0) {
                    const diffInfo = difficultyColors[node.difficulty] || difficultyColors['intermediate'];
                    ctx.font = `${14 * scale}px Arial`;
                    ctx.fillText(diffInfo.emoji, drawX + drawWidth / 2 - 12 * scale, drawY - drawHeight / 2 + 12 * scale);
                }
                
                ctx.restore();
            }
            
            
            function drawConnection(parent, child) {
                const parentFloatY = Math.sin(time * 0.002 + parent.level * 0.3) * 3;
                const childFloatY = Math.sin(time * 0.002 + child.level * 0.3) * 3;
                
                const startX = (parent.x + offsetX) * scale;
                const startY = (parent.y + offsetY + parentFloatY) * scale;
                const endX = (child.x + offsetX) * scale;
                const endY = (child.y + offsetY + childFloatY) * scale;
                
                
                const childAnim = animatingNodes.get(child.id);
                const opacity = childAnim ? childAnim.opacity : 1;
                
                
                const colors = getCategoryColor(child);
                const primaryColor = child.level === 0 ? '#d4af37' : colors.primary;
                
                ctx.save();
                ctx.globalAlpha = opacity;
                
                
                const gradient = ctx.createLinearGradient(startX, startY, endX, endY);
                gradient.addColorStop(0, `${primaryColor}99`);
                gradient.addColorStop(0.5, `${primaryColor}4d`);
                gradient.addColorStop(1, `${primaryColor}99`);
                
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2 * scale;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                
                const particleProgress = ((Math.sin(time * 0.003) + 1) / 2);
                const particleX = startX + (endX - startX) * particleProgress;
                const particleY = startY + (endY - startY) * particleProgress;
                
                ctx.beginPath();
                ctx.arc(particleX, particleY, 3 * scale, 0, Math.PI * 2);
                ctx.fillStyle = primaryColor;
                ctx.fill();
                
                ctx.restore();
            }
            
            
            function drawParticles() {
                
                for (let i = 0; i < 20; i++) {
                    const x = ((Math.sin(time * 0.0002 + i * 0.1) * 0.5 + 0.5) * canvas.width + offsetX) * scale;
                    const y = ((Math.cos(time * 0.00015 + i * 0.15) * 0.5 + 0.5) * canvas.height + offsetY) * scale;
                    const size = (Math.sin(time * 0.0008 + i) * 0.5 + 1.5) * scale;
                    const opacity = Math.sin(time * 0.0008 + i * 0.2) * 0.1 + 0.08;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(212, 175, 55, ${opacity})`;
                    ctx.fill();
                }
            }
            
            
            function drawLegend() {
                const legendX = 20;
                const legendY = 30;
                const itemSpacing = 130;
                
                ctx.save();
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.roundRect(legendX - 10, legendY - 20, 400, 45, 10);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                
                ctx.fillStyle = '#fff';
                ctx.fillText('🟢 Easy', legendX, legendY);
                
                
                ctx.fillText('🟡 Intermediate', legendX + itemSpacing, legendY);
                
                
                ctx.fillText('🔴 Advanced', legendX + itemSpacing * 2, legendY);
                
                ctx.restore();
            }
            
            
            function isInsideNode(x, y, node) {
                const width = node.level === 0 ? 160 : node.level === 1 ? 140 : node.level === 2 ? 120 : 100;
                const height = node.level === 0 ? 60 : node.level === 1 ? 50 : node.level === 2 ? 45 : 40;
                
                
                const worldX = (x / scale) - offsetX;
                const worldY = (y / scale) - offsetY;
                
                const halfWidth = width / 2;
                const halfHeight = height / 2;
                
                return worldX >= node.x - halfWidth && worldX <= node.x + halfWidth &&
                       worldY >= node.y - halfHeight && worldY <= node.y + halfHeight;
            }
            
            
            function findNodeAtPosition(x, y, node) {
                if (isInsideNode(x, y, node)) {
                    return node;
                }
                if (node.children) {
                    for (const child of node.children) {
                        const found = findNodeAtPosition(x, y, child);
                        if (found) return found;
                    }
                }
                return null;
            }
            
            
            function drawMindmapRecursive(node, parentExpanded, parent = null) {
                
                if (node.children && node.children.length > 0 && parentExpanded) {
                    node.children.forEach(child => {
                        drawConnection(node, child);
                        drawMindmapRecursive(child, expandedNodes.has(child.id), node);
                    });
                }
                
                
                drawNode(node, parent);
            }
            
            
            function drawMindmap() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                
                updateAnimations();
                
                
                drawParticles();
                
                
                drawLegend();
                
                
                const startX = canvas.width / 2;
                const startY = canvas.height / 2;
                calculatePositions(mindmapData, startX, startY, 0, true, 'down');
                
                
                drawMindmapRecursive(mindmapData, true, null);
                
                time += 16;
                animationFrame = requestAnimationFrame(drawMindmap);
            }
            
            
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                const clickedNode = findNodeAtPosition(clickX, clickY, mindmapData);
                
                if (clickedNode && clickedNode.children && clickedNode.children.length > 0) {
                    if (expandedNodes.has(clickedNode.id)) {
                        
                        clickedNode.children.forEach(child => {
                            animateNode(child, 0, 0.5);
                        });
                        setTimeout(() => {
                            expandedNodes.delete(clickedNode.id);
                        }, 400);
                    } else {
                        
                        expandedNodes.add(clickedNode.id);
                        clickedNode.children.forEach(child => {
                            animateNode(child, 1, 1);
                        });
                    }
                }
            });
            
            
            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                
                const clickedNode = findNodeAtPosition(clickX, clickY, mindmapData);
                
                if (!clickedNode) {
                    
                    isDragging = true;
                    dragStartX = clickX;
                    dragStartY = clickY;
                    dragOffsetX = offsetX;
                    dragOffsetY = offsetY;
                    canvas.style.cursor = 'grabbing';
                }
            });
            
            
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                if (isDragging) {
                    
                    offsetX = dragOffsetX + (mouseX - dragStartX) / scale;
                    offsetY = dragOffsetY + (mouseY - dragStartY) / scale;
                } else {
                    
                    const found = findNodeAtPosition(mouseX, mouseY, mindmapData);
                    hoveredNode = found;
                    canvas.style.cursor = found ? 'pointer' : 'grab';
                }
            });
            
            
            canvas.addEventListener('mouseup', () => {
                isDragging = false;
                canvas.style.cursor = hoveredNode ? 'pointer' : 'grab';
            });
            
            
            canvas.addEventListener('mouseleave', () => {
                isDragging = false;
                hoveredNode = null;
                canvas.style.cursor = 'grab';
            });
            
            
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                
                const worldX = (mouseX / scale) - offsetX;
                const worldY = (mouseY / scale) - offsetY;
                
                
                const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.max(0.3, Math.min(3, scale * zoomFactor));
                
                
                offsetX = (mouseX / newScale) - worldX;
                offsetY = (mouseY / newScale) - worldY;
                scale = newScale;
            });
            
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        </script>
