    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div id="lightbox-caption"></div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Parallax pan functionality
            const container = document.getElementById('drag-container');
            const canvas = document.getElementById('drag-canvas');

            // Start in the center of the canvas
            if (container && canvas) {
                container.scrollLeft = (canvas.offsetWidth - container.clientWidth) / 2;
                container.scrollTop = (canvas.offsetHeight - container.clientHeight) / 2;
                
                // Add smooth transition for parallax
                canvas.style.transition = 'transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            }

            document.addEventListener('mousemove', (e) => {
                if(canvas) {
                    const x = (e.clientX - window.innerWidth / 2) * -0.12; // Parallax intensity
                    const y = (e.clientY - window.innerHeight / 2) * -0.12;
                    canvas.style.transform = `translate(${x}px, ${y}px)`;
                }
            });

            // Lightbox functionality
            const dragCards = document.querySelectorAll('.drag-card');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCaption = document.getElementById('lightbox-caption');
            const closeBtn = document.querySelector('.close-lightbox');
            
            dragCards.forEach(card => {
                card.addEventListener('click', () => {
                    const img = card.querySelector('.card-img-wrapper img');
                    // Only open lightbox if card has an image
                    if(img) {
                        lightbox.style.display = 'flex';
                        lightboxImg.src = img.src;
                        
                        const title = card.querySelector('h4') ? card.querySelector('h4').textContent : '';
                        const desc = card.querySelector('.card-info .card-text p') ? card.querySelector('.card-info .card-text p').textContent : '';
                        lightboxCaption.innerHTML = `<strong>${title}</strong> - ${desc}`;
                    }
                });
            });

            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    lightbox.style.display = 'none';
                });
            }

            if (lightbox) {
                lightbox.addEventListener('click', (e) => {
                    if (e.target !== lightboxImg) {
                        lightbox.style.display = 'none';
                    }
                });
            }
        });
    </script>
