    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="photos/logo.png">
    <link rel="icon" type="image/png" href="photos/logo.png">
    
    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Vivek Yadav Interactive Terminal",
        "url": "https://vivek-rahagir.com/terminal.html",
        "description": "An interactive command line portfolio experience showcasing technical skills, projects, and achievements of Vivek Yadav.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All",
        "author": {
            "@type": "Person",
            "name": "Vivek Yadav",
            "url": "https://vivek-rahagir.com"
        }
    }
    </script>
    
    <link rel="stylesheet" href="terminal.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <canvas class="matrix-bg" id="matrixCanvas"></canvas>
    
    
    <div class="scanlines"></div>
    
    <div class="terminal-container">
        <div class="terminal-window" id="terminalWindow">
            <canvas class="terminal-matrix-bg" id="terminalMatrixCanvas"></canvas>
            <div class="terminal-header">
                <div class="terminal-buttons">
                    <span class="btn close" id="closeBtn"></span>
                    <span class="btn minimize" id="minimizeBtn"></span>
                    <span class="btn maximize" id="maximizeBtn"></span>
                </div>
                <div class="terminal-title">vivek_yadav --info</div>
            </div>
            <div class="terminal-body" id="terminal-body">
                
            </div>
            <div class="terminal-input-line">
                <span class="prompt">guest@vivek-rahagir:~$</span>
                <input type="text" id="terminal-input" autocomplete="off" autofocus>
            </div>
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot online"></span>
                    <span>SYSTEM ONLINE</span>
                </div>
                <div class="status-item">
                    <span id="currentTime">00:00:00</span>
                </div>
            </div>
        </div>
    </div>
    
    
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-modal">
            <div class="popup-header">
                <h3 class="popup-title" id="popupTitle">System Alert</h3>
                <button class="popup-close" id="popupClose">×</button>
            </div>
            <div class="popup-content" id="popupContent">
                <p>System message goes here...</p>
            </div>
            <div class="popup-actions" id="popupActions">
                <button class="popup-btn" id="popupCancel">Cancel</button>
                <button class="popup-btn primary" id="popupConfirm">Confirm</button>
            </div>
        </div>
    </div>
    
    <script src="terminal.js"></script>
</body>
</html>
